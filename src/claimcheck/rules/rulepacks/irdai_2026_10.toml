[[rule]]
rule_id = "PD.2024.SCOPE.CONTESTED"
version = 1
title = "Whether the 2024 regime confined proportionate deduction to the room-rent line"
kind = "contested"
effect = "INFORM_ONLY"
citation = "not found in the primary text read (IRDAI/HLT/CIR/PRO/84/5/2024, 17 pp.)"
quote = ""
effective_from = "2024-05-29"
verified_on = "2026-10-03"
valid_for_days = 180
scope = "proportionate deduction after 29 May 2024"
verdict_effect = "Cannot assert anything. Forces the affected heads to be computed under each reading (policy AME scope vs room-rent-only scope) and returns UNDETERMINED when the readings differ materially."
evidence_requirement = []
human_escalation = false
notes = """
OV-3. Secondary sources state the 29 May 2024 Master Circular restricted the ratio to the room-rent line. The Master Circular, read in full (all four parts), contains no proportionate-deduction provision at all: its claim clauses are 17(a) repudiation approval, 17(b) reasons for partial disallowance and 17(c) document collection. Until a primary instrument supports the narrower scope, the system computes BOTH readings and refuses to pick.
"""

  [rule.applicability]
  fact = { fact_id = "claim.proportionate_deduction_applied", op = "eq", value = true }

  [rule.instrument]
  ref = "IRDAI/HLT/CIR/PRO/84/5/2024"
  title = "Master Circular on IRDAI (Insurance Products) Regulations 2024 - Health Insurance"
  issued_on = "2024-05-29"
  retrieved_at = "2026-10-02"

