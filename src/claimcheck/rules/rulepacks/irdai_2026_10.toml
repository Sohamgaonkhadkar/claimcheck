evidence_requirement = ["settlement_ratio_scope", "bill_head_amounts"]
human_escalation = false
tests = ["test_rules.py::test_pd_exclusions_barred_heads"]

  [rule.instrument]
  ref = "IRDAI/HLT/REG/CIR/151/06/2020"
  title = "Modified Guidelines on Product filing in Health Insurance Business - Norms on Proportionate Deductions"
  issued_on = "2020-06-11"
