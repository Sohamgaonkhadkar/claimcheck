[[rule]]
rule_id = "CL.INTEREST"
version = 2
title = "Delay in payment attracts interest at 2% above the bank rate"
kind = "standardised"
effect = "ENTITLE_INTEREST"
citation = "Annexure-1, clause 3(ii)"
quote = "ii. In the case of delay in the payment of a claim, the Company shall be liable to pay interest to the policyholder from the date of receipt of last necessary document to the date of payment of claim at a rate 2% above the bank rate."
effective_from = "2020-10-01"
verified_on = "2026-10-03"
valid_for_days = 180
scope = "all claims settled beyond the timelines in the same clause"
verdict_effect = "The one procedural rule that legitimately produces a rupee figure, computed by the deterministic engine from dated facts."
evidence_requirement = ["intimation_date", "payment_date"]
human_escalation = true
notes = "Bank rate is the RBI rate fixed at the beginning of the financial year in which the claim fell due (the Explanation to this clause says so); the rate is a dated parameter, not a constant in code. Retargeted on 2026-10-03 from the 2024 POPI circular to this clause: the POPI text restates the entitlement (and adds that it is paid suo motu) but its own capture is not stored in the corpus, so it could not be quoted or verified - a rule may only assert on a clause that can be produced. The quote carries the clause marker because sub-clause 3(iv) repeats almost the same sentence for delays beyond 45 days; without the marker the sentence cannot be located uniquely, and the linker refuses an ambiguous quote rather than choosing between them."

  [rule.instrument]
  ref = "IRDAI/HLT/REG/CIR/152/06/2020"
  title = "Guidelines on Standardization of General Terms and Clauses in Health Insurance Policy Contracts"
  issued_on = "2020-06-11"
  retrieved_at = "2026-10-03"
  url = "https://irdai.gov.in/document-detail?documentId=394691"

