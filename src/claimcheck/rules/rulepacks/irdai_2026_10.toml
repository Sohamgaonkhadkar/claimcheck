[[rule]]
rule_id = "CL.TAT.POPI.15D"
version = 1
title = "POPI Master Circular: non-cashless claims settled within fifteen days from submission"
kind = "contested"
effect = "REQUIRE_TIMELINESS"
citation = "Section 2, claim settlement under health insurance policies, clause 5 and TAT table"
quote = "Settlement of claims (other than cashless) shall be settled within fifteen days from submission of claim."
effective_from = "2024-09-05"
verified_on = "2026-10-03"
valid_for_days = 180
scope = "health claims, other than cashless"
verdict_effect = "Cannot assert anything on its own: the trigger ('submission of claim') is not defined in the instrument and coexists with the 30/45-day frame keyed to the 'last necessary document'. Both bounds are presented with their instruments."
evidence_requirement = ["claim_submission_date", "last_document_date", "decision_date"]
human_escalation = false
notes = "OV-2. Resolution path: read the POPI Master Circular Section 2 in full to establish whether the fifteen-day clock runs from first submission or from the receipt of all documents. Until then this is CONTESTED, not a rule."

