[[rule]]
rule_id = "PD.NO_DIFFERENTIAL"
version = 1
title = "No proportionate deduction where the hospital does not bill differentially by room category"
kind = "standardised"
effect = "REQUIRE_CONDITION"
citation = "para 6"
quote = "Insurers shall ensure that proportionate deductions are not applied in respect of the hospitals which do not follow differential billing or for those expenses in respect of which differential billing is not adopted based on the room category. This shall be clearly specified in the policy terms and conditions."
effective_from = "2020-10-01"
verified_on = "2026-10-03"
valid_for_days = 180
scope = "all hospitals and all heads where billing is not differentiated by room category"
