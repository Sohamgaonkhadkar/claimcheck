# The IRDAI rule pack. Verified against primary instruments on 2026-10-03.
#
# HOW TO READ THIS FILE
# =====================
# * ``verified_on`` + ``valid_for_days`` implement the **freshness gate**. The 29 May
#   2024 Master Circular supersedes the instruments listed in its Annexure-6, and that
#   list has not been read by this project (open item OV-1). Rather than assert a
#   breach from a circular whose in-force status we cannot yet demonstrate, every rule
#   carries a verification date and degrades to UNVERIFIED when that date ages out.
# * Nothing here is encoded from a secondary description. Where the primary text was
#   not read (e.g. the item lists' full current text, OV-5), the rule is marked
#   ``status = "unverified"`` and cannot carry a verdict.
# * ``kind = "contested"`` marks a position on which sources disagree and the primary
#   text does not settle the question. A contested rule can never assert a breach; it
#   forces the affected head to be computed under every reading.
#
# The quotes are verbatim from the instruments named in ``instrument``. The paragraph
# numbers were read directly (see docs/rules.md for the verification log).

[rulepack]
version = "2026.10.1"
released_on = "2026-10-03"
notes = """
Rules verified from the primary instruments on 2026-10-03 by reading the circular
text. Open items that cap what these rules may assert:
  OV-1  Annexure-6 of the 29 May 2024 Master Circular (the repeal list) has not been
        read -> the freshness gate is set to 180 days and every rule in this pack
        reports its verification date.
  OV-2  POPI Master Circular (05.09.2024) says non-cashless claims "shall be settled
        within fifteen days from submission of claim" while the regulations/FAQ
        frame is 30 days from the last necessary document (45 with investigation).
        Both bounds are carried, each with its own instrument; neither is asserted
        alone.
  OV-3  No primary provision restricting proportionate deduction to the room-rent
        line was found. The claim remains contested and is encoded as such.
  OV-5  The current text of the standardised item lists (post-2022 modification) has
        not been ingested, so item-level rules from the lists are UNVERIFIED.
"""

