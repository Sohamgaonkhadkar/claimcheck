# Proportionate deduction — IRDAI/HLT/REG/CIR/151/06/2020, verified verbatim
# ---------------------------------------------------------------------------
[[rule]]
rule_id = "PD.AME.DEFINE"
version = 1
title = "A proportionate-deduction policy must define 'associated medical expenses'"
kind = "policy_dependent"
effect = "REQUIRE_PARAMETER_PRESENT"
citation = "para 3"
quote = "Where as part of product design insurers propose proportionate deduction of the 'associated medical expenses' when a policyholder chooses a higher room category than the category that is eligible as per terms and conditions of the policy, insurers shall define 'associated medical expenses' in the terms and conditions of policy contract."
effective_from = "2020-10-01"
verified_on = "2026-10-03"
valid_for_days = 180
scope = "health products filed on or after 01.10.2020; existing contracts on renewal from 01.04.2021"
verdict_effect = "If the policy applies a proportionate deduction but defines no associated medical expenses, the deduction has no lawful scope and the affected head is UNDETERMINED."
evidence_requirement = ["policy_ame_definition_present"]
human_escalation = false
tests = ["test_rules.py::test_pd_define_absent_definition_blocks"]
notes = "Applies to products filed on/after 01.10.2020 and, for existing contracts, on renewal from 01.04.2021 (para 8). The presence of the definition is a fact; its ABSENCE is a finding input, not a licence to import a market convention."

  [rule.instrument]
  ref = "IRDAI/HLT/REG/CIR/151/06/2020"
  title = "Modified Guidelines on Product filing in Health Insurance Business - Norms on Proportionate Deductions"
  issued_on = "2020-06-11"
  url = "https://irdai.gov.in/document-detail?documentId=394680"
  retrieved_at = "2026-10-03"

  [rule.source]
  corpus_document_id = "irdai-hlt-reg-cir-151-06-2020"
  clause_id = "irdai-hlt-reg-cir-151-06-2020#3"
  corpus_snapshot_id = "SNAP-v0.1-D685D386F98A"

  [rule.applicability]
  all = [
    { fact = { fact_id = "policy.era_in_scope", op = "eq", value = true } },
    { fact = { fact_id = "claim.proportionate_deduction_applied", op = "eq", value = true } },
  ]

